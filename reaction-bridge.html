<!--
  This page exists for one reason: Neocities applies a Content-Security-
  Policy to newer accounts that blocks fetch() to any domain but itself
  (connect-src 'self'). Hosted off Neocities (e.g. GitHub Pages, which sets
  no such policy), this page is embedded as a hidden iframe on the real
  site. An iframe from a different origin runs under ITS OWN page's CSP,
  not the parent page's — so the actual Supabase calls happen here, and the
  main site just postMessages a request over and waits for a reply.

  Only postMessages from ALLOWED_ORIGIN are answered — this page is public
  and reachable by anyone, so that check is what stops a stranger's page
  from using it to write to (or read from) the reactions table.
-->
