<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>reaction bridge</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<script>
  const SUPABASE_URL = "https://gxkvmhaghxdmkrlimtee.supabase.co";
  const SUPABASE_KEY = "sb_publishable_SHOuNlE6JXzNfCqMy6Dkrg_yx_s0Tvk";
  const ALLOWED_ORIGIN = "https://thisallusedtobewoods.neocities.org";

  console.log("[bridge] script loaded, waiting for messages. allowed origin:", ALLOWED_ORIGIN);

  window.addEventListener("message", async (event) => {
    console.log("[bridge] message event from", event.origin, event.data);
    if (event.origin !== ALLOWED_ORIGIN) {
      console.log("[bridge] ignoring — origin mismatch. expected:", ALLOWED_ORIGIN, "got:", event.origin);
      return;
    }
    const msg = event.data || {};
    const { requestId, action } = msg;
    if (!requestId || !action) {
      console.log("[bridge] ignoring — missing requestId or action", msg);
      return;
    }

    let result = { ok: false };
    try {
      if (action === "hit") {
        const key = `${msg.kind}-${msg.id}`;
        console.log("[bridge] hit — calling increment_reaction with key:", key);
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_reaction`, {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ reaction_key: key })
        });
        const bodyText = await res.text();
        console.log("[bridge] increment_reaction response:", res.status, bodyText);
        result = { ok: res.ok };
      } else if (action === "getAll") {
        console.log("[bridge] getAll — fetching reactions table");
        const res = await fetch(`${SUPABASE_URL}/rest/v1/reactions?select=key,count`, {
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        result = { ok: res.ok, data: res.ok ? await res.json() : [] };
        console.log("[bridge] getAll response:", res.status, result);
      }
    } catch (e) {
      console.error("[bridge] caught error:", e);
      result = { ok: false, error: String(e) };
    }

    console.log("[bridge] posting result back to parent:", result);
    event.source.postMessage({ requestId, result }, event.origin);
  });
</script>
</body>
</html>
